# Local dev database with pgvector (cosine similarity for BGE-M3 embeddings)
# Start:  docker compose up -d
# Stop:   docker compose down          (add -v to also delete the data)
# NOTE: credentials MUST match DATABASE_URL in .env
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: dalil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aboodandabood
      POSTGRES_DB: dalil_al_ahkam
    ports:
      - "5432:5432"
    volumes:
      - dalil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dalil_al_ahkam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dalil_pgdata:
